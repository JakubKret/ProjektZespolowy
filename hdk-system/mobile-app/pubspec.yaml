name: hdk_mobile_app
description: HDK system mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '^3.11.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  google_mlkit_text_recognition: ^0.15.1
  local_auth: ^2.1.3
  local_auth_android: ^1.0.32
  local_auth_darwin: ^1.1.2
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
